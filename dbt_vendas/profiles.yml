dbt_vendas:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: "{{ env_var('DB_DRIVER', 'ODBC Driver 18 for SQL Server') }}"
      server: "{{ env_var('DB_SERVER') }}"
      port: 1433
      database: "{{ env_var('DB_DATABASE') }}"
      schema: dbo
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      authentication: "{{ env_var('DB_AUTHENTICATION', 'sql') }}"
      encrypt: false
      trust_cert: true
      threads: 4